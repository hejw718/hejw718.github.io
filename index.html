        :root {
            --primary-color: #1a4a6e;
            --accent-color: #f9d923;
            --danger-color: #a02828;
            --bg-color: #f8f9fa;
            --card-bg: #ffffff;
            --text-primary: #212529;
            --text-secondary: #6c757d;
            --shadow-sm: 0 2px 4px rgba(0, 0, 0, 0.08);
            --shadow-md: 0 4px 12px rgba(0, 0, 0, 0.12);
            --shadow-lg: 0 8px 24px rgba(0, 0, 0, 0.15);
            --header-height: 120px;
            --tab-height: 56px;
            --border-radius: 12px;
            --transition-speed: 0.3s;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
            background: var(--bg-color);
            color: var(--text-primary);
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        /* 固定頂部導航 */
        .app-header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            background: linear-gradient(135deg, var(--primary-color) 0%, #2563a8 100%);
            color: white;
            z-index: 100;
            box-shadow: var(--shadow-md);
            will-change: transform;
        }

        .header-content {
            padding: 16px 20px 12px;
        }

        .header-title {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 4px;
            letter-spacing: -0.3px;
        }

        .header-subtitle {
            font-size: 13px;
            opacity: 0.9;
            font-weight: 400;
        }

        /* Tab 導航 - 橫向滑動 */
        .tab-nav-wrapper {
            position: relative;
            background: var(--card-bg);
            border-bottom: 1px solid rgba(0, 0, 0, 0.08);
        }

        .tab-nav {
            display: flex;
            overflow-x: auto;
            overflow-y: hidden;
            scroll-behavior: smooth;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
            -ms-overflow-style: none;
            will-change: scroll-position;
        }

        .tab-nav::-webkit-scrollbar {
            display: none;
        }

        .tab-item {
            flex: 0 0 auto;
            padding: 16px 20px;
            cursor: pointer;
            border-bottom: 3px solid transparent;
            transition: all var(--transition-speed) cubic-bezier(0.4, 0, 0.2, 1);
            user-select: none;
            white-space: nowrap;
            position: relative;
        }

        .tab-item.active {
            border-bottom-color: var(--accent-color);
        }

        .tab-day {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 2px;
        }

        .tab-date {
            font-size: 11px;
            color: var(--text-secondary);
        }

        .tab-item.active .tab-day {
            color: var(--primary-color);
        }

        /* 內容區域 */
        .app-content {
            margin-top: var(--header-height);
            min-height: calc(100vh - var(--header-height));
            padding-bottom: 20px;
        }

        .day-content {
            display: none;
            animation: fadeIn 0.3s ease-out;
        }

        .day-content.active {
            display: block;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* 行程卡片 */
        .timeline {
            padding: 16px;
        }

        .trip-card {
            background: var(--card-bg);
            border-radius: var(--border-radius);
            margin-bottom: 12px;
            overflow: hidden;
            box-shadow: var(--shadow-sm);
            transition: transform 0.2s, box-shadow 0.2s;
            will-change: transform;
            cursor: pointer;
        }

        .trip-card:active {
            transform: scale(0.98);
        }

        .card-image {
            width: 100%;
            height: 160px;
            background-size: cover;
            background-position: center;
            position: relative;
        }

        .card-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(to top, rgba(0, 0, 0, 0.7) 0%, transparent 100%);
            padding: 16px;
            color: white;
        }

        .card-category {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            opacity: 0.9;
            margin-bottom: 4px;
        }

        .card-title {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 4px;
        }

        .card-time {
            font-size: 13px;
            opacity: 0.9;
        }

        .card-body {
            padding: 16px;
        }

        .card-description {
            font-size: 14px;
            color: var(--text-secondary);
            line-height: 1.5;
            margin-bottom: 12px;
        }

        .card-actions {
            display: flex;
            gap: 12px;
            padding-top: 12px;
            border-top: 1px solid rgba(0, 0, 0, 0.06);
        }

        .btn-action {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            text-decoration: none;
            text-align: center;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .btn-primary {
            background: var(--primary-color);
            color: white;
        }

        .btn-primary:active {
            background: #153a5a;
        }

        .btn-secondary {
            background: #e9ecef;
            color: var(--text-primary);
        }

        .btn-secondary:active {
            background: #dee2e6;
        }

        /* 交通卡片 */
        .transit-card {
            background: #f8f9fa;
            border-radius: var(--border-radius);
            padding: 14px 16px;
            margin-bottom: 12px;
            border-left: 4px solid #007bff;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .transit-icon {
            font-size: 24px;
            flex-shrink: 0;
        }

        .transit-info {
            flex: 1;
            min-width: 0;
        }

        .transit-duration {
            font-size: 14px;
            font-weight: 700;
            color: #007bff;
            margin-bottom: 4px;
        }

        .transit-route {
            font-size: 13px;
            color: var(--text-secondary);
            line-height: 1.4;
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.6);
            z-index: 1000;
            animation: fadeIn 0.2s;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
        }

        .modal.active {
            display: flex;
            align-items: flex-end;
        }

        .modal-content {
            background: white;
            border-radius: 20px 20px 0 0;
            width: 100%;
            max-height: 85vh;
            overflow-y: auto;
            animation: slideUp 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        @keyframes slideUp {
            from {
                transform: translateY(100%);
            }

            to {
                transform: translateY(0);
            }
        }

        .modal-header {
            position: sticky;
            top: 0;
            background: white;
            padding: 20px;
            border-bottom: 1px solid rgba(0, 0, 0, 0.08);
            z-index: 1;
        }

        .modal-close {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: #f1f3f5;
            border: none;
            font-size: 20px;
            cursor: pointer;
            float: right;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .modal-title {
            font-size: 20px;
            font-weight: 700;
            color: var(--primary-color);
            margin-top: 8px;
        }

        .modal-image {
            width: 100%;
            height: 200px;
            background-size: cover;
            background-position: center;
        }

        .modal-body {
            padding: 20px;
        }

        .modal-info-item {
            margin-bottom: 16px;
        }

        .modal-label {
            font-size: 12px;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 6px;
        }

        .modal-value {
            font-size: 15px;
            color: var(--text-primary);
            line-height: 1.5;
        }

        .modal-actions {
            padding: 16px 20px 32px;
            display: flex;
            gap: 12px;
        }

        /* 響應式 */
        @media (min-width: 768px) {
            .modal.active {
                align-items: center;
                justify-content: center;
            }

            .modal-content {
                max-width: 600px;
                border-radius: 20px;
                max-height: 90vh;
            }
        }

        /* 效能優化 */
        .will-change-transform {
            will-change: transform;
        }

        .gpu-accelerated {
            transform: translateZ(0);
            backface-visibility: hidden;
        }
    </style>
</head>

                    },
                    {

                        hours: ['09:30 - 18:00 (週四至 21:45)'],

                        hours: ['12:00–14:30, 19:30–22:30'],

                        image: 'https://images.unsplash.com/photo-1577782390886-07469a4c14c5?w=800'
                    }
                ]
            }
        };

        // 效能優化的 Tab 切換
        const tabNav = document.getElementById('tabNav');
        const appContent = document.getElementById('appContent');
        const tabItems = document.querySelectorAll('.tab-item');
        const modal = document.getElementById('modal');

        let currentDay = 1;
        const loadedDays = new Set();

        // 初始化
        function init() {
            renderDay(1);
            loadedDays.add(1);
        }

        // 事件委派 - Tab 切換
        tabNav.addEventListener('click', (e) => {
            const tab = e.target.closest('.tab-item');
            if (!tab) return;

            const day = parseInt(tab.dataset.day);
            if (day === currentDay) return;

            switchDay(day);
        }, { passive: true });

        function switchDay(day) {
            // 移除舊的 active
            tabItems[currentDay - 1].classList.remove('active');

            // 添加新的 active
            currentDay = day;
            tabItems[day - 1].classList.add('active');

            // 滾動 Tab 到可見位置
            tabItems[day - 1].scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });

            // 渲染內容
            if (!loadedDays.has(day)) {
                renderDay(day);
                loadedDays.add(day);
            } else {
                // 切換顯示
                document.querySelectorAll('.day-content').forEach(el => el.classList.remove('active'));
                const targetDay = appContent.querySelector(`.day-content[data-day="${day}"]`);
                if (targetDay) {
                    targetDay.classList.add('active');
                }
            }
        }

        // 渲染單天內容
        function renderDay(day) {
            const data = itineraryData[day];
            if (!data) return;

            const dayContent = document.createElement('div');
            dayContent.className = 'day-content active';
            dayContent.dataset.day = day;

            const timeline = document.createElement('div');
            timeline.className = 'timeline';

            data.items.forEach(item => {
                if (item.type === 'transit') {
                    timeline.appendChild(createTransitCard(item));
                } else if (item.type === 'card') {
                    timeline.appendChild(createTripCard(item));
                }
            });

            dayContent.appendChild(timeline);

            // 移除其他天的 active
            document.querySelectorAll('.day-content').forEach(el => el.classList.remove('active'));

            appContent.appendChild(dayContent);
        }

        // 創建交通卡片
        function createTransitCard(data) {
            const card = document.createElement('div');
            card.className = 'transit-card';
            card.innerHTML = `
                <div class="transit-icon">${data.icon}</div>
                <div class="transit-info">
                    <div class="transit-duration">${data.duration}</div>
                    <div class="transit-route">${data.route}</div>
                </div>
            `;
            return card;
        }

        // 創建行程卡片
        function createTripCard(data) {
            const card = document.createElement('div');
            card.className = 'trip-card';
            card.onclick = () => showModal(data);

            card.innerHTML = `
                <div class="card-image" style="background-image: url('${data.image}')">
                    <div class="card-overlay">
                        <div class="card-category">${data.category}</div>
                        <div class="card-title">${data.title}</div>
                        <div class="card-time">${data.time}</div>
                    </div>
                </div>
                <div class="card-body">
                    <div class="card-description">${data.description}</div>
                    <div class="card-actions">
                        <a href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(data.location)}" 
                           target="_blank" class="btn-action btn-secondary" onclick="event.stopPropagation()">
                            📍 地圖
                        </a>
                        <a href="https://www.google.com/maps/dir/?api=1&origin=Leonardo+Boutique+Hotel+Paris+Opera&destination=${encodeURIComponent(data.location)}" 
                           target="_blank" class="btn-action btn-primary" onclick="event.stopPropagation()">
                            🚗 導航
                        </a>
                    </div>
                </div>
            `;
            return card;
        }

        // Modal 函數
        function showModal(data) {
            document.getElementById('modalTitle').textContent = data.category + ':' + data.title;
            document.getElementById('modalTime').textContent = data.time;
            document.getElementById('modalLocation').textContent = data.location;
            document.getElementById('modalDescription').textContent = data.description;
            document.getElementById('modalImage').style.backgroundImage = `url('${data.image}')`;

            const hoursHtml = data.hours.map(h => `<div>${h}</div>`).join('');
            document.getElementById('modalHours').innerHTML = hoursHtml;

            const mapUrl = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(data.location)}`;
            const navUrl = `https://www.google.com/maps/dir/?api=1&origin=Leonardo+Boutique+Hotel+Paris+Opera&destination=${encodeURIComponent(data.location)}`;

            document.getElementById('modalMapLink').href = mapUrl;
            document.getElementById('modalNavLink').href = navUrl;

            modal.classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function closeModal() {
            modal.classList.remove('active');
            document.body.style.overflow = '';
        }

        // 點擊背景關閉
        modal.addEventListener('click', (e) => {
            if (e.target === modal) closeModal();
        });

        // 效能優化: Passive 事件監聽
        document.addEventListener('touchstart', () => { }, { passive: true });

        // 啟動
        init();
    </script>
