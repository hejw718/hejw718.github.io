        }

            white-space: nowrap;

        }

            color: var(--primary-color);
        }

        .app-content {

            min-height: calc(100vh - var(--header-height));
            padding-bottom: 20px;
            position: relative;
            z-index: 1;
        }

        .day-content {
            display: none;
            animation: fadeIn 0.3s;
        }

        .day-content.active {
            display: block;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }

        }

            background-position: center;
            position: relative;

                    rain: '40%',
                    suggestion: '可能下雨,建議攜帶雨具'
                },
                items: [
                    {
                        type: 'transit',
                        icon: '🚇',
                        duration: '12 分鐘',
                        route: '從飯店出發前往羅浮宮<br>Grands Boulevards → Palais Royal - Musée du Louvre'
                    },
                    {
                        type: 'card',
                        category: '景點',
                        title: '羅浮宮',
                        time: '09:15',
                        description: '週四開放,務必預約',
                        hours: ['09:00 - 18:00'],
                        location: 'Louvre Museum Paris',
                        image: 'https://images.unsplash.com/photo-1549722736-218044738734?w=800'
                    },
                    {
                        type: 'transit',
                        icon: '🚶',
                        duration: '11 分鐘',
                        route: '前往杜樂麗花園 (800公尺)'
                    },
                    {
                        type: 'card',
                        category: '活動',
                        title: '杜樂麗花園',
                        time: '14:00',
                        description: '買輕食野餐',
                        hours: ['07:30 - 19:30'],
                        location: 'Jardin des Tuileries Paris',
                        image: 'https://images.unsplash.com/photo-1570779836365-a6e5b22b109c?w=800'
                    },
                    {
                        type: 'transit',
                        icon: '🚶',
                        duration: '5 分鐘',
                        route: '前往奧賽美術館 (過橋)'
                    },
                    {
                        type: 'card',
                        category: '景點',
                        title: '奧賽美術館',
                        time: '15:15',
                        description: '欣賞印象派畫作',
                        hours: ['09:30 - 18:00 (週四至 21:45)'],
                        location: 'Musée d\'Orsay Paris',
                        image: 'https://images.unsplash.com/photo-1550992388-517f8b9e6918?w=800'
                    },
                    {
                        type: 'transit',
                        icon: '🚶',
                        duration: '28 分鐘',
                        route: '前往莎士比亞書店 (2公里)'
                    },
                    {
                        type: 'card',
                        category: '書店',
                        title: '莎士比亞書店',
                        time: '18:00',
                        description: '左岸傳奇書店',
                        hours: ['10:00 - 21:00'],
                        location: 'Shakespeare and Company Paris',
                        image: 'https://images.unsplash.com/photo-1517487213459-a5e2b0a3c267?w=800'
                    },
                    {
                        type: 'transit',
                        icon: '🚶',
                        duration: '10 分鐘',
                        route: '前往餐廳'
                    },
                    {
                        type: 'card',
                        category: '晚餐',
                        title: 'Chez René',
                        time: '18:35',
                        description: '左岸經典法式料理',
                        hours: ['12:00–14:30, 19:30–22:30'],
                        location: 'Chez René Paris',
                        image: 'https://images.unsplash.com/photo-1577782390886-07469a4c14c5?w=800'
                    }
                ]
            }
        };

        // 效能優化的 Tab 切換
        const tabNav = document.getElementById('tabNav');
        const appContent = document.getElementById('appContent');
        const tabItems = document.querySelectorAll('.tab-item');

        let currentDay = 1;
        const loadedDays = new Set();

        // 初始化
        function init() {
            renderDay(1);
            loadedDays.add(1);
        }

        // 事件委派 - Tab 切換
        tabNav.addEventListener('click', (e) => {
            const tab = e.target.closest('.tab-item');
            if (!tab) return;

            const day = parseInt(tab.dataset.day);
            if (day === currentDay) return;

            switchDay(day);
        }, { passive: true });

        function switchDay(day) {
            // 移除舊的 active
            tabItems[currentDay - 1].classList.remove('active');

            // 添加新的 active
            currentDay = day;
            tabItems[day - 1].classList.add('active');

            // 滾動 Tab 到可見位置
            tabItems[day - 1].scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });

            // 渲染內容
            if (!loadedDays.has(day)) {
                renderDay(day);
                loadedDays.add(day);
            } else {
                // 切換顯示
                document.querySelectorAll('.day-content').forEach(el => el.classList.remove('active'));
                const targetDay = appContent.querySelector(`.day-content[data-day="${day}"]`);
                if (targetDay) {
                    targetDay.classList.add('active');
                }
            }
        }

        // 渲染單天內容
        function renderDay(day) {
            const data = itineraryData[day];
            if (!data) return;

            const dayContent = document.createElement('div');
            dayContent.className = 'day-content active';
            dayContent.dataset.day = day;

            const timeline = document.createElement('div');
            timeline.className = 'timeline';

            // 加入天氣卡片
            if (data.weather) {
                timeline.appendChild(createWeatherCard(data.weather));
            }

            data.items.forEach(item => {
                if (item.type === 'transit') {
                    timeline.appendChild(createTransitCard(item));
                } else if (item.type === 'card') {
                    timeline.appendChild(createTripCard(item));
                }
            });

            dayContent.appendChild(timeline);

            // 移除其他天的 active
            document.querySelectorAll('.day-content').forEach(el => el.classList.remove('active'));

            appContent.appendChild(dayContent);
        }

        // 創建天氣卡片
        function createWeatherCard(weather) {
            const card = document.createElement('div');
            card.className = 'weather-card';
            card.innerHTML = `
                <div class="weather-header">
                    <div class="weather-icon">${weather.icon}</div>
                    <div class="weather-main">
                        <div class="weather-temp">${weather.temp}</div>
                        <div class="weather-desc">${weather.condition}</div>
                    </div>
                </div>
                <div class="weather-details">
                    <div class="weather-detail-item">
                        <div class="weather-detail-label">高溫/低溫</div>
                        <div class="weather-detail-value">${weather.high} / ${weather.low}</div>
                    </div>
                    <div class="weather-detail-item">
                        <div class="weather-detail-label">降雨機率</div>
                        <div class="weather-detail-value">${weather.rain}</div>
                    </div>
                    <div class="weather-detail-item" style="grid-column: 1 / -1;">
                        <div class="weather-detail-label">建議</div>
                        <div class="weather-detail-value">${weather.suggestion}</div>
                    </div>
                </div>
            `;
            return card;
        }

        // 創建交通卡片
        function createTransitCard(data) {
            const card = document.createElement('div');
            card.className = 'transit-card';
            card.innerHTML = `
                <div class="transit-icon">${data.icon}</div>
                <div class="transit-info">
                    <div class="transit-duration">${data.duration}</div>
                    <div class="transit-route">${data.route}</div>
                </div>
            `;
            return card;
        }

        // 創建行程卡片
        function createTripCard(data) {
            const card = document.createElement('div');
            card.className = 'trip-card';

            const cardId = 'card-' + Math.random().toString(36).substr(2, 9);

            card.innerHTML = `
                <div class="card-image" style="background-image: url('${data.image}')">
                    <div class="card-overlay">
                        <div class="card-category">${data.category}</div>
                        <div class="card-title">${data.title}</div>
                        <div class="card-time">⏰ ${data.time}</div>
                    </div>
                </div>
                <div class="card-body">
                    <div class="card-description">${data.description}</div>
                    <button class="btn-expand" onclick="toggleDetails('${cardId}')">
                        <span id="${cardId}-icon">▼</span> 查看詳細資訊
                    </button>
                    <div class="card-details" id="${cardId}">
                        <div class="card-details-content">
                            <div class="detail-item">
                                <div class="detail-label">時間</div>
                                <div class="detail-value">${data.time}</div>
                            </div>
                            <div class="detail-item">
                                <div class="detail-label">地點</div>
                                <div class="detail-value">${data.location}</div>
                            </div>
                            <div class="detail-item">
                                <div class="detail-label">營業時間</div>
                                <div class="detail-value">${data.hours.join('<br>')}</div>
                            </div>
                        </div>
                    </div>
                    <div class="card-actions">
                        <a href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(data.location)}" target="_blank"
                           class="btn-action btn-secondary">
                            📍 地圖
                        </a>
                        <a href="https://www.google.com/maps/dir/?api=1&origin=Leonardo+Boutique+Hotel+Paris+Opera&destination=${encodeURIComponent(data.location)}"
                           target="_blank" class="btn-action btn-primary">
                            🚗 導航
                        </a>
                    </div>
                </div>
            `;
            return card;
        }

        // 切換詳細資訊顯示
        function toggleDetails(cardId) {
            const details = document.getElementById(cardId);
            const icon = document.getElementById(cardId + '-icon');

            if (details.classList.contains('expanded')) {
                details.classList.remove('expanded');
                icon.textContent = '▼';
            } else {
                details.classList.add('expanded');
                icon.textContent = '▲';
            }
        }

        // 效能優化: Passive 事件監聽
        document.addEventListener('touchstart', () => { }, { passive: true });

        // 啟動
        init();
    </script>
</body>
